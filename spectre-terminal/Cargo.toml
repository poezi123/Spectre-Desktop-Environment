[package]
name = "spectre-terminal"
description = "The Spectre terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "spectre-terminal"
path = "src/main.rs"

[dependencies]
spectre-config = { workspace = true }
spectre-draw = { workspace = true }
spectre-text = { workspace = true }
spectre-theme = { workspace = true }

alacritty_terminal = "0.26"
anyhow = { workspace = true }
libc = "0.2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
