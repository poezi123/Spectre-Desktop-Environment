# Spectre desktop configuration.
#
# Copy to ~/.config/spectre/spectre.toml and edit. Every key is optional: what
# you leave out keeps the shipped default, so a file with a single line is fine.

[general]
# performance | balanced | spectre | custom
#   performance  static patterns, no blur, no animations - old laptops and VMs
#   balanced     the default: the contour lines are held still, but their
#                colours travel, which is the cheap half of the animation
#   spectre      everything on, including animated patterns - modern hardware
#   custom       the [effects] section below is used verbatim
profile = "balanced"

# Start XWayland so programs written for X11 can run. Turn it off to save a
# little memory when you only use Wayland programs.
xwayland = true
# Only start XWayland once you launch a program, not at login. It costs about
# 65 MB of memory, so a session that never runs an X11 program never pays for it.
xwayland-lazy = true
workspaces = 4
# spectre-panel is started automatically unless [panel] enabled = false;
# anything listed here runs after it.
autostart = []

# Only read when profile = "custom".
[effects]
blur = false
shadows = true
rounded-corners = true
window-animations = true
animation-speed = 1.0
# none | fade | slide | depth | cube | coverflow
workspace-transition = "slide"
# How often the moving pattern is redrawn. 30 looks smoothest, 15 and 8 use
# noticeably less power. Anything outside 4 to 60 is pulled back into that range.
pattern-frames-per-second = 30
# Strength of the RGB accent glow around the focused window, 0.0 to 1.0.
rgb-glow = 0.45

# The output the session drives. `auto` takes the display's preferred mode;
# otherwise `1920x1080` or `1920x1080@60`. Both keys apply without a restart.
[display]
resolution = "auto"
scale = 1.0

# The desktop background. Leave the wallpaper out for the Spectre black.
# mode: fill | fit | stretch | center
[desktop]
# wallpaper = "/usr/share/backgrounds/spectre.png"
wallpaper-mode = "fill"

[input.keyboard]
# Empty means "use the system default" (localectl).
layout = ""
variant = ""
options = ""
repeat-delay = 400
repeat-rate = 30

[input.pointer]
accel-speed = 0.0
accel-profile = "adaptive"
natural-scroll = false
tap-to-click = true
focus-follows-mouse = false

[input.cursor]
# Spectre draws its own pointer wherever a program has not set one.
# Height of the arrow in logical pixels, 8 to 96.
size = 24
# Leave the colours out for a black pointer with a white edge.
# Set them to any hex colour, e.g. fill = "#e6f2f5" for a light pointer.
# fill = "#000000"
# outline = "#ffffff"

[panel]
enabled = true
# top | bottom | left | right
position = "bottom"
floating = false
opacity = 1.0

[theme.metrics]
titlebar-height = 32
border-width = 1
corner-radius = 8
panel-height = 32

# The topographic contour pattern drawn on window title bars. Set
# kind = "none" to switch it off, or animated = false to freeze it while
# keeping the texture.
#
# Animating it means a new frame every vblank for the whole output. That is
# why only the "spectre" profile turns it on; with profile = "custom" you can
# have it on any machine you think can afford it.
[theme.window-pattern]
kind = "topographic"
# Whether the contour lines themselves scroll.
animated = true
speed = 0.6
# Whether the line colours travel along the accent, independently of the lines.
color-cycle = true
color-speed = 0.5
intensity = 0.55

[theme.desktop-pattern]
kind = "none"

# Bindings merge over the defaults, so only list what you want to change.
# Actions: spawn (with `command`), close-window, quit, focus-next, focus-prev,
# focus-direction / move-direction (with `direction`), toggle-maximize,
# toggle-fullscreen, workspace / move-to-workspace (with `index`),
# next-workspace, prev-workspace, toggle-animations, cycle-profile,
# toggle-launcher, lock-session, screenshot, minimize, snap-left, snap-right,
# show-desktop.
[session]
# Which program locks the screen. Super+L starts it, and it takes over the
# whole screen until it lets go again.
lock-command = "spectre-lock"
# Seconds without keyboard or mouse before the screen goes dark, and before the
# session locks itself. 0 turns either of them off. A video player can hold the
# screen awake while it plays.
blank-after = 300
lock-after = 0

[terminal]
# The Spectre terminal: text size in pixels and how many lines of history it
# keeps. Ctrl with plus or minus changes the size while it runs.
font-size = 14.0
scrollback = 10000
# Which terminal Super+Return, Ctrl+Alt+T and the desktop menu open. Put
# "spectre-terminal" here for Spectre's own one.
command = "konsole"

[keybinds]
"Mod+Return" = { action = "spawn", command = "konsole" }
